name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.x"
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -cover ./...
      - name: Build
        run: go build -trimpath ./cmd/lctk

  code-intel:
    # The per-project service is a separate module for two reasons, both of which
    # keep it out of the portable host executable: it links Zoekt, whose low-level
    # index package is Unix-specific (ADR-0011), and it reaches Tree-sitter through
    # cgo (ADR-0019). Being excluded from the root module also means the jobs above
    # never compile it, so this job is what keeps it from rotting unnoticed.
    name: Code-intel service (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images/code-intel
    env:
      # cgo is required, not optional. Building with it off would silently skip
      # the symbol layer's C dependency and prove nothing about the shipped image.
      CGO_ENABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: images/code-intel/go.sum
      - name: Install the arm64 cross compiler
        # The arm64 build below needs a C compiler for that target. It compiles
        # rather than runs, which is what ADR-0019 records as verified.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -cover ./...
      - name: Test under the race detector
        # The symbol engine pools parsers because a Tree-sitter parser is not safe
        # for concurrent use, and the HTTP surface serves concurrent requests. That
        # pool is only actually checked here.
        run: go test -race ./internal/symbols/...
      - name: Build for both target architectures
        run: |
          GOARCH=amd64 go build -trimpath -o /dev/null ./
          GOARCH=arm64 CC=aarch64-linux-gnu-gcc go build -trimpath -o /dev/null ./
