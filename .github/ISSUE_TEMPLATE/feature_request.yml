name: Feature request
description: Propose a focused capability or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem rather than only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Architecture impact
      description: Note project-scope, persistence, MCP API, runner, or Docker-administration implications.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
