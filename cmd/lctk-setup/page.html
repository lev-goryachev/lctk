<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install LCTK</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; max-width: 48rem; margin: 4rem auto; padding: 0 1.5rem; }
h1 { margin-bottom: .25rem; } .muted { opacity: .7; } .error { color: #b42318; }
.card { border: 1px solid #aaa6; border-radius: .75rem; padding: 1rem 1.25rem; margin: 1.25rem 0; }
dl { display: grid; grid-template-columns: 12rem 1fr; gap: .45rem; } dt { opacity: .7; } dd { margin: 0; }
button { font: inherit; padding: .65rem 1rem; border: 0; border-radius: .5rem; background: #2563eb; color: white; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<h1>Install LCTK</h1>
<div class="muted">One private runtime, no Docker Desktop, no build tools.</div>
<div class="card"><dl id="plan"></dl></div>
<p id="message">Loading the verified plan...</p>
<p id="error" class="error"></p>
<button id="install" disabled>Install LCTK</button>
<script>
"use strict";
const token = "{{.Token}}";
const plan = document.getElementById("plan");
const message = document.getElementById("message");
const error = document.getElementById("error");
const install = document.getElementById("install");
let started = false;
function row(label, value) { const dt = document.createElement("dt"); const dd = document.createElement("dd"); dt.textContent = label; dd.textContent = value; plan.append(dt, dd); }
async function refresh() {
  const response = await fetch("/api/status", { cache: "no-store" });
  const state = await response.json();
  if (!plan.children.length) {
    row("Version", state.plan.version);
    row("Windows", "build " + state.plan.host.build + ", " + state.plan.host.architecture);
    row("WSL2", state.plan.host.wsl_ready ? "ready" : "will be enabled; restart required");
    row("Download", Math.ceil(state.plan.download_bytes / 1048576) + " MiB");
    row("Runtime", "Podman " + state.plan.runtime.version + " in an LCTK-managed WSL machine");
  }
  message.textContent = state.detail;
  error.textContent = state.error || "";
  install.disabled = started || state.installing || state.complete || state.reboot_required;
  if (state.installing || state.complete || state.reboot_required) { started = true; }
  if (!state.complete && !state.reboot_required) { setTimeout(refresh, 1000); }
}
install.addEventListener("click", async () => {
  install.disabled = true; started = true;
  const response = await fetch("/api/install", { method: "POST", headers: { "X-LCTK-Setup": token } });
  if (!response.ok) { const body = await response.json(); error.textContent = body.error || "Setup could not start."; }
  refresh();
});
refresh().catch((err) => { error.textContent = err.message; });
</script>
</body>
</html>
