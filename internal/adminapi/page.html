<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCTK</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in srgb, currentColor 15%, transparent); }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 2rem 1.5rem; max-width: 60rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  h2 { font-size: .95rem; margin: 2rem 0 .5rem; text-transform: uppercase; letter-spacing: .06em; opacity: .6; }
  .muted { opacity: .65; }
  .row { display: flex; gap: .75rem; align-items: baseline; flex-wrap: wrap; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; opacity: .6; }
  code, .mono { font-family: ui-monospace, monospace; font-size: .85em; }
  button, select { font: inherit; padding: .2rem .55rem; border-radius: .35rem;
                   border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .pill { display: inline-block; padding: .05rem .45rem; border-radius: 1rem; border: 1px solid var(--line); font-size: .8rem; }
  .running { border-color: #3a8f4a; } .stopped { border-color: #999; } .error { border-color: #b3403a; }
  .warn { color: #b3403a; }
  pre { background: color-mix(in srgb, currentColor 6%, transparent); padding: .75rem; border-radius: .4rem;
        overflow: auto; max-height: 22rem; font-size: .8rem; margin: 0; }
  #banner { padding: .6rem .8rem; border: 1px solid var(--line); border-radius: .4rem; margin-bottom: 1rem; }
  #signin { display: none; }
</style>
</head>
<body>

<h1>LCTK</h1>
<div class="muted mono" id="subtitle">connecting…</div>
<div id="banner" hidden></div>

<div id="signin">
  <h2>Sign in</h2>
  <p class="muted">This page needs a one-time code. Run <code>lctk admin open</code> and follow the link it prints.</p>
</div>

<div id="app" hidden>
  <h2>Projects</h2>
  <table id="projects"><thead><tr>
    <th>Project</th><th>State</th><th>Index</th><th>Changes</th><th>Mode</th><th></th>
  </tr></thead><tbody></tbody></table>

  <h2>Client grants</h2>
  <table id="grants"><thead><tr>
    <th>Client</th><th>Projects</th><th>Issued</th><th></th>
  </tr></thead><tbody></tbody></table>

  <h2>Daemon log</h2>
  <pre id="logs">…</pre>
  <div class="row" style="margin-top:.75rem">
    <button id="refresh">Refresh</button>
    <button id="signout">Sign out</button>
  </div>
</div>

<script>
"use strict";
// The CSRF token lives only in this closure. It is not put in storage, because
// anything that can read storage can already act as the administrator, and a
// token that outlives the tab is a token that outlives the reason to trust it.
let csrf = null;

const $ = (id) => document.getElementById(id);
const text = (value) => (value === undefined || value === null ? "" : String(value));

function say(message, bad) {
  const banner = $("banner");
  banner.hidden = !message;
  banner.textContent = text(message);
  banner.className = bad ? "warn" : "";
}

// Every value from the API is inserted as text, never as markup. A project name
// comes from a folder on disk, and a folder can be named anything at all.
function cell(row, value) {
  const td = document.createElement("td");
  if (value instanceof Node) { td.appendChild(value); } else { td.textContent = text(value); }
  row.appendChild(td);
  return td;
}

function pill(label, kind) {
  const span = document.createElement("span");
  span.className = "pill " + text(kind);
  span.textContent = text(label);
  return span;
}

async function api(path, options) {
  const settings = Object.assign({ headers: {} }, options || {});
  if (settings.method && settings.method !== "GET") {
    settings.headers["X-LCTK-Admin"] = csrf || "";
    settings.headers["Content-Type"] = "application/json";
  }
  const response = await fetch(path, settings);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) { throw new Error(body.error || ("request failed with " + response.status)); }
  return body;
}

async function signIn(code) {
  const body = await api("/admin/session", { method: "POST", body: JSON.stringify({ code: code }) });
  csrf = body.csrf;
  // The code is spent, so remove it from the address bar before it reaches
  // history, a bookmark, or a screenshot.
  history.replaceState(null, "", "/admin/");
}

function action(label, handler) {
  const button = document.createElement("button");
  button.textContent = label;
  button.addEventListener("click", async () => {
    button.disabled = true;
    say(label + "…");
    try { await handler(); say(""); await load(); }
    catch (err) { say(err.message, true); }
    finally { button.disabled = false; }
  });
  return button;
}

function renderProjects(projects) {
  const body = $("projects").querySelector("tbody");
  body.replaceChildren();

  for (const project of projects) {
    const row = document.createElement("tr");

    const name = document.createElement("div");
    name.textContent = text(project.name);
    const path = document.createElement("div");
    path.className = "muted mono";
    path.textContent = text(project.path);
    const identity = document.createElement("div");
    identity.append(name, path);
    cell(row, identity);

    const state = pill(project.state, project.state);
    const stateCell = cell(row, state);
    if (project.detail) {
      const detail = document.createElement("div");
      detail.className = "muted";
      detail.textContent = text(project.detail);
      stateCell.appendChild(detail);
    }

    if (project.index) {
      const summary = project.index.file_count + " files, generation " + project.index.generation;
      cell(row, project.index.indexing ? summary + " (building)" : summary);
    } else {
      cell(row, "—");
    }

    if (project.changes) {
      const changes = project.changes.complete
        ? (project.changes.pending === 0 ? "up to date" : project.changes.pending + " pending")
        : "incomplete: " + text(project.changes.gap_reason);
      const changeCell = cell(row, changes);
      if (!project.changes.complete || project.changes.last_error) { changeCell.className = "warn"; }
      if (project.changes.last_error) {
        const detail = document.createElement("div");
        detail.className = "muted";
        detail.textContent = text(project.changes.last_error);
        changeCell.appendChild(detail);
      }
    } else {
      cell(row, "not watched");
    }

    const select = document.createElement("select");
    for (const mode of ["quiet", "normal", "fast"]) {
      const option = document.createElement("option");
      option.value = mode;
      option.textContent = mode;
      option.selected = mode === project.mode;
      select.appendChild(option);
    }
    select.addEventListener("change", async () => {
      try {
        const body = await api("/admin/api/projects/" + encodeURIComponent(project.id) + "/mode",
          { method: "POST", body: JSON.stringify({ mode: select.value }) });
        say(body.note);
      } catch (err) { say(err.message, true); }
    });
    cell(row, select);

    const controls = document.createElement("div");
    controls.className = "row";
    const call = (verb) => () => api("/admin/api/projects/" + encodeURIComponent(project.id) + "/" + verb,
      { method: "POST" });
    if (project.state === "running") {
      controls.append(action("Stop", call("stop")), action("Restart", call("restart")),
        action("Reindex", call("reindex")));
    } else {
      controls.append(action("Start", call("start")));
    }
    cell(row, controls);

    body.appendChild(row);
  }
  if (projects.length === 0) {
    const row = document.createElement("tr");
    const empty = cell(row, "No projects registered. Add one with lctk project add PATH.");
    empty.colSpan = 6;
    empty.className = "muted";
    body.appendChild(row);
  }
}

function renderGrants(grants) {
  const body = $("grants").querySelector("tbody");
  body.replaceChildren();
  for (const grant of grants) {
    const row = document.createElement("tr");
    cell(row, grant.client);
    cell(row, (grant.projects || []).join(", "));
    cell(row, grant.issued_at);
    cell(row, grant.revoked
      ? pill("revoked", "stopped")
      : action("Revoke", () => api("/admin/api/grants/" + encodeURIComponent(grant.id), { method: "DELETE" })));
    body.appendChild(row);
  }
}

async function load() {
  const [overview, projects, grants, logs] = await Promise.all([
    api("/admin/api/overview"), api("/admin/api/projects"),
    api("/admin/api/grants"), api("/admin/api/logs"),
  ]);

  $("subtitle").textContent = "lctk " + text(overview.version) + " · " +
    (overview.runtime.available
      ? "Docker " + text(overview.runtime.api_version) + " (" + text(overview.runtime.os_type) + ")"
      : "container runtime unavailable: " + text(overview.runtime.detail)) +
    " · " + text(overview.home);

  renderProjects(projects.projects || []);
  renderGrants(grants.grants || []);

  const records = logs.records || [];
  $("logs").textContent = records.length === 0
    ? "nothing logged yet"
    : records.slice(-200).map((record) => {
        const fields = Object.entries(record.fields || {}).map(([k, v]) => k + "=" + v).join(" ");
        return record.at + "  " + record.level + "  " + record.message + (fields ? "  " + fields : "");
      }).join("\n");
}

async function start() {
  const code = new URLSearchParams(location.search).get("code");
  try {
    if (code) { await signIn(code); }
    await load();
    $("app").hidden = false;
  } catch (err) {
    $("signin").style.display = "block";
    $("subtitle").textContent = "not signed in";
    if (code) { say(err.message, true); }
  }
}

$("refresh").addEventListener("click", () => load().catch((err) => say(err.message, true)));
$("signout").addEventListener("click", async () => {
  await api("/admin/session", { method: "DELETE" }).catch(() => {});
  location.href = "/admin/";
});

start();
</script>
</body>
</html>
